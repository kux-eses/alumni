<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彰化縣二水國民小學 - 傑出校友菁英錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F8FAFC;
            color: #334155;
        }
        .serif {
            font-family: 'Noto Serif TC', serif;
        }
        .bg-grid-pattern {
            background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #B45309 0%, #D97706 50%, #78350F 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }
        .badge-amber {
            background-color: #FEF3C7;
            color: #92400E;
            border: 1px solid #FDE68A;
        }
        .badge-slate {
            background-color: #F1F5F9;
            color: #475569;
            border: 1px solid #E2E8F0;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- 頁首 Header -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                <div>
                    <h1 class="serif font-bold text-xl sm:text-2xl text-slate-900 tracking-wide">彰化縣二水國民小學</h1>
                    <p class="text-xs text-amber-700 font-semibold tracking-wider uppercase">Outstanding Alumni</p>
                </div>
            </div>
            
            <a href="https://eses.chc.edu.tw/" target="_blank" rel="noopener noreferrer" class="hidden sm:inline-flex items-center space-x-2 bg-slate-100 hover:bg-amber-50 hover:text-amber-800 hover:border-amber-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition border border-slate-300 shadow-sm">
                <i class="fa-solid font-bold fa-house text-amber-600"></i>
                <span>返回學校首頁</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-60"></i>
            </a>
        </div>
    </header>

    <!-- 主區塊 Hero Section -->
    <section class="relative bg-white border-b border-slate-200 bg-grid-pattern py-12 sm:py-16 overflow-hidden">
        <div class="max-w-5xl mx-auto px-4 text-center relative z-10">
            <div class="inline-flex items-center space-x-2 bg-amber-50 border border-amber-200 rounded-full px-4 py-1.5 text-amber-800 text-sm font-medium mb-4">
                <i class="fa-solid fa-award text-amber-600"></i>
                <span>二水國小 培育英才成果展</span>
            </div>
            
            <h2 class="serif text-3xl sm:text-5xl font-extrabold text-slate-900 mb-4 tracking-tight">
                傑出校友<span class="gold-gradient-text">菁英錄</span>
            </h2>
            
            <p class="text-slate-600 text-base sm:text-lg max-w-2xl mx-auto leading-relaxed">
                百年樹人，桃李芬芳。二水國小自創校以來，培養出無數各界領袖與傑出菁英，以卓著成就為母校增光，為社會作楷模。
            </p>

            <!-- 搜尋與篩選 -->
            <div class="mt-8 max-w-xl mx-auto flex flex-col sm:flex-row gap-3 px-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="filterAlumni()" placeholder="搜尋校友姓名或成就關鍵字..." 
                           class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:bg-white focus:outline-none transition shadow-sm text-sm">
                </div>
                <div class="flex gap-2">
                    <button onclick="setFilter('all')" id="btn-all" class="filter-btn active flex-1 sm:flex-none px-4 py-3 bg-amber-600 text-white rounded-xl text-sm font-semibold shadow-sm transition">全部</button>
                    <button onclick="setFilter('pre')" id="btn-pre" class="filter-btn flex-1 sm:flex-none px-4 py-3 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 rounded-xl text-sm font-semibold transition">光復前</button>
                    <button onclick="setFilter('post')" id="btn-post" class="filter-btn flex-1 sm:flex-none px-4 py-3 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 rounded-xl text-sm font-semibold transition">光復後</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 卡片列表區塊 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-1">
        <div id="alumniGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 靜態卡片由 JS 動態生成 -->
        </div>

        <div id="noResults" class="hidden text-center py-16">
            <i class="fa-solid fa-user-slash text-4xl text-slate-300 mb-3"></i>
            <p class="text-slate-500 font-medium">未找到符合條件的校友資料</p>
        </div>
    </main>

    <!-- 詳細資訊彈窗 Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl border border-slate-100 transform transition-all">
            <div class="bg-slate-900 text-white p-6 relative">
                <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition text-lg w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-800">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div>
                    <span id="modalGrad" class="text-xs text-amber-400 font-semibold uppercase tracking-wider block">畢業年度</span>
                    <h3 id="modalName" class="serif text-2xl font-bold">校友姓名</h3>
                </div>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">職務與主要成就</h4>
                    <p id="modalAchievement" class="text-slate-700 leading-relaxed font-medium text-base whitespace-pre-line"></p>
                </div>
                <div class="pt-4 border-t border-slate-100">
                    <a id="modalLink" href="#" target="_blank" rel="noopener noreferrer" class="w-full inline-flex items-center justify-center space-x-2 bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl font-semibold transition shadow-sm">
                        <span>查看詳細介紹頁面</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁尾 Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
            <p class="text-slate-200 font-semibold text-sm">彰化縣二水國民小學 Ershui Elementary School</p>
            <p class="text-xs text-slate-500">© 2026 二水國小 傑出校友專題網頁 版權所有</p>
        </div>
    </footer>

    <script>
        const alumniData = [
            {
                id: 1,
                name: "謝東閔 先生",
                period: "pre",
                gradYear: "民國11年畢業（光復前第16屆）",
                achievement: "本名謝進喜，曾任中華民國副總統、臺灣省政府主席、高雄實踐家專（現實踐大學）創辦人。為二水國小百年間最傑出的校友之一。",
                link: "https://zh.wikipedia.org/zh-tw/%E8%AC%9D%E6%9D%B1%E9%96%94_(%E5%8F%B0%E7%81%A3)",
                tag: "光復前菁英"
            },
            {
                id: 2,
                name: "楊進添 先生",
                period: "post",
                gradYear: "民國43年畢業（光復後第9屆）",
                achievement: "曾任中華民國外交部長、總統府秘書長。",
                link: "https://zh.wikipedia.org/zh-tw/%E6%A5%8A%E9%80%B2%E6%B7%BB",
                tag: "外交/政務"
            },
            {
                id: 3,
                name: "蔡勳雄 先生",
                period: "post",
                gradYear: "民國41年畢業（光復後第7屆）",
                achievement: "曾任中華民國行政院環境保護署署長。",
                link: "https://zh.wikipedia.org/zh-tw/%E8%94%A1%E5%8B%B3%E9%9B%84",
                tag: "環保/政務"
            },
            {
                id: 7,
                name: "鄭智仁 醫師",
                period: "post",
                gradYear: "民國52年畢業（光復後第18屆）",
                achievement: "【醫學成就】專精於細胞學、放射線學與男性生殖醫學。著有《臨床體外授精與胚胎移植》與《男性不孕症學》等專業書籍，並擁有多項醫學發明專利。\n【音樂創作】1999年九二一地震，作品「天總是攏會光」撫慰全台人心。2002年以「天頂的星」榮獲第13屆金曲獎傳統藝術音樂作品類—「最佳作詞人」及「最佳演唱人」，同年獲高雄市政府文藝獎「終身成就獎」。「月娘光光」、「福爾摩沙頌（抱著咱的夢）」、「天頂的星」等歌曲陸續被收入國小、國中、高中音樂課本。",
                link: "https://ctrl.chcg.gov.tw/book/no12/09-4.htm",
                tag: "醫學/藝文"
            },
            {
                id: 4,
                name: "王美花 女士",
                period: "post",
                gradYear: "民國59年畢業（光復後第25屆）",
                achievement: "曾任中華民國經濟部部長。",
                link: "https://zh.wikipedia.org/zh-tw/%E7%8E%8B%E7%BE%8E%E8%8A%B1",
                tag: "經濟/政務"
            },
            {
                id: 5,
                name: "周輝煌 先生",
                period: "post",
                gradYear: "民國61年畢業（光復後第27屆）",
                achievement: "曾任法務部矯正署署長。",
                link: "https://wpm.cpu.edu.tw/p/406-1045-41762,r766.php",
                tag: "司法/矯正"
            },
            {
                id: 8,
                name: "張東浩 先生",
                period: "post",
                gradYear: "民國66年畢業（光復後第32屆）",
                achievement: "現任彰化基督教醫院副院長。",
                link: "https://health.tvbs.com.tw/expert/cch025",
                tag: "醫療/醫務"
            },
            {
                id: 6,
                name: "楊昆弼 先生",
                period: "post",
                gradYear: "民國98年畢業（光復後第65屆）",
                achievement: "2018年亞洲運動會男子不定向飛靶金牌、2022年世界錦標賽男子不定向飛靶銅牌、2026年射擊飛靶世界盃男子不定向飛靶男女混雙金牌。",
                link: "https://zh.wikipedia.org/zh-tw/%E6%A5%8A%E6%98%86%E5%BC%BC",
                tag: "體壇之光"
            }
        ];

        let currentFilter = 'all';

        function renderAlumni(data) {
            const grid = document.getElementById('alumniGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm card-hover flex flex-col justify-between relative overflow-hidden group';
                card.innerHTML = `
                    <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-amber-500 to-amber-700"></div>
                    <div>
                        <div class="flex items-start justify-between mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-md ${item.period === 'pre' ? 'badge-amber' : 'badge-slate'}">
                                ${item.tag}
                            </span>
                            <span class="text-xs font-medium text-slate-400">
                                <i class="fa-solid fa-graduation-cap mr-1"></i>${item.gradYear.split('（')[0]}
                            </span>
                        </div>
                        <h3 class="serif text-2xl font-bold text-slate-900 mb-1 group-hover:text-amber-700 transition-colors">
                            ${item.name}
                        </h3>
                        <p class="text-xs font-medium text-amber-700 mb-4">${item.gradYear}</p>
                        <p class="text-slate-600 text-sm line-clamp-3 leading-relaxed mb-6">
                            ${item.achievement.replace(/\n/g, ' ')}
                        </p>
                    </div>
                    
                    <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                        <button onclick="openModal(${item.id})" class="text-xs font-semibold text-slate-600 hover:text-amber-700 flex items-center space-x-1 transition">
                            <span>完整簡介</span>
                            <i class="fa-solid fa-chevron-right text-[10px]"></i>
                        </button>
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-1.5 text-xs font-semibold text-amber-700 hover:text-amber-800 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-lg border border-amber-200 transition">
                            <span>相關介紹</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterAlumni() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = alumniData.filter(item => {
                const matchesFilter = currentFilter === 'all' || item.period === currentFilter;
                const matchesSearch = item.name.toLowerCase().includes(query) || 
                                      item.achievement.toLowerCase().includes(query) ||
                                      item.gradYear.toLowerCase().includes(query);
                return matchesFilter && matchesSearch;
            });
            renderAlumni(filtered);
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn flex-1 sm:flex-none px-4 py-3 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 rounded-xl text-sm font-semibold transition';
            });
            const activeBtn = document.getElementById(`btn-${filter}`);
            activeBtn.className = 'filter-btn active flex-1 sm:flex-none px-4 py-3 bg-amber-600 text-white rounded-xl text-sm font-semibold shadow-sm transition';
            filterAlumni();
        }

        function openModal(id) {
            const item = alumniData.find(a => a.id === id);
            if (!item) return;
            document.getElementById('modalName').textContent = item.name;
            document.getElementById('modalGrad').textContent = item.gradYear;
            document.getElementById('modalAchievement').textContent = item.achievement;
            document.getElementById('modalLink').href = item.link;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // 初始渲染
        renderAlumni(alumniData);
    </script>
</body>
</html>
